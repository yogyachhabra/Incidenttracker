<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Days Since Last Incident: Hazard Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame">
    <main class="page">
      <div class="sign" role="banner">
        <i class="bolt a"></i><i class="bolt b"></i><i class="bolt c"></i><i class="bolt d"></i>
        <h1>Days Since<br><span>Last Incident</span></h1>
      </div>

      <section class="boards" id="boards" aria-label="Incident counters"></section>

      <footer>A pretend safety board for a very eventful planet. Numbers are fixed sample values.</footer>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
